name: Crear tag

# Crea un tag en un commit concreto. Se lanza a mano (Actions → Crear tag → Run workflow).
on:
  # El push solo registra el workflow en GitHub; el trabajo se salta.
  push:
    paths:
      - .github/workflows/crear-tag.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Nombre del tag (p. ej. v1.0-baseline)
        required: true
      commit:
        description: Commit al que apunta el tag
        required: true

permissions:
  contents: write

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Crear y subir el tag
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
        run: |
          git cat-file -e "$COMMIT^{commit}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "El tag $TAG ya existe" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$COMMIT" -m "$TAG"
          git push origin "refs/tags/$TAG"
